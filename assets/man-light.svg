<text x="8" y="78" font-weight="700">EKLAVYA(1)</text><text x="600.0" y="78" text-anchor="middle" fill="#656d76">User Commands</text><text x="1192" y="78" text-anchor="end" font-weight="700">EKLAVYA(1)</text>
<text x="8" y="124" xml:space="preserve"><tspan font-weight="700">NAME</tspan></text>
<text x="69.19999999999999" y="151" xml:space="preserve"><tspan font-weight="700">eklavya pandey</tspan><tspan> - builds tools that take something real and make it run</tspan></text>
<text x="8" y="193" xml:space="preserve"><tspan font-weight="700">SYNOPSIS</tspan></text>
<text x="69.19999999999999" y="220" xml:space="preserve"><tspan font-weight="700">eklavya</tspan><tspan> [</tspan><tspan font-weight="700">--build</tspan><tspan>] [</tspan><tspan font-weight="700">--ship</tspan><tspan>] </tspan><tspan text-decoration="underline">idea</tspan></text>
<text x="8" y="262" xml:space="preserve"><tspan font-weight="700">DESCRIPTION</tspan></text>
<text x="69.19999999999999" y="289" xml:space="preserve"><tspan>AI &amp; Data Science student in Mumbai. Writes dev tools, LLM agents,</tspan></text>
<text x="69.19999999999999" y="316" xml:space="preserve"><tspan>and the evals that keep them honest. Best known for </tspan><tspan font-weight="700">breakinggood</tspan><tspan>(1).</tspan></text>
