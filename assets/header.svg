<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="eklavya pandey">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="1" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7f5"/>
      <stop offset="0.55" stop-color="#d7fbe8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1f2a33"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,"Liberation Mono",monospace}
      .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect x="-400" y="0" width="400" height="300" fill="url(#sweep)">
      <animate attributeName="x" from="-400" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1200" height="3" fill="#4ade80" opacity=".85"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#1f2a33"/>

  <g transform="translate(64 0)">
    <text class="mono rise d1" x="0" y="78" font-size="15" fill="#4ade80" letter-spacing="2">~/mumbai $ whoami <tspan class="blink">▍</tspan></text>
    <text class="sans rise d2" x="-3" y="152" font-size="72" font-weight="800" fill="url(#ink)" letter-spacing="-2.5">eklavya pandey</text>
    <text class="sans rise d3" x="0" y="196" font-size="22" fill="#a9b4bd">I build tools that take something real and make it run.</text>
    <g class="rise d4">
      <text class="mono" x="0" y="246" xml:space="preserve" font-size="15" fill="#6b7a86"><tspan fill="#e6edf3">dev tools</tspan>  ·  <tspan fill="#e6edf3">LLM agents</tspan>  ·  <tspan fill="#e6edf3">evals</tspan>  ·  <tspan fill="#e6edf3">fine-tuning</tspan>  ·  <tspan fill="#e6edf3">computer vision</tspan></text>
    </g>
  </g>

  <g transform="translate(1010 150)" class="mono">
    <circle r="78" fill="none" stroke="#1f2a33" stroke-width="1"/>
    <circle r="78" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="60 430" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="54" fill="none" stroke="#1f2a33" stroke-width="1" stroke-dasharray="3 6"/>
    <text y="-6" text-anchor="middle" font-size="13" fill="#6b7a86">npx</text>
    <text y="16" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">breakinggood</text>
    <circle class="pulse" cx="0" cy="36" r="4" fill="#4ade80"/>
  </g>
</svg>
