<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="npx breakinggood https://tailwindcss.com rebuilding the site as a running React project">
  <defs>
    <clipPath id="typed">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="600" begin=".4s" dur="1.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,"Liberation Mono",monospace;font-size:16px}
      .dim{fill:#6b7a86}.txt{fill:#d6dde3}.ok{fill:#4ade80}.hi{fill:#e6edf3;font-weight:700}.url{fill:#7dd3fc}
      .l{opacity:0;animation:in .25s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
      .a1{animation-delay:2.3s}.a2{animation-delay:3.0s}.a3{animation-delay:3.7s}.a4{animation-delay:4.4s}
      .a5{animation-delay:5.4s}.a6{animation-delay:6.1s}.a7{animation-delay:6.9s}.a8{animation-delay:7.8s}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect x=".5" y=".5" width="899" height="399" rx="14" fill="#0b0f14" stroke="#1f2a33"/>
  <path d="M.5 40.5h899" stroke="#1f2a33"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="dim" style="font-size:13px">~/projects</text>

  <g transform="translate(28 82)">
    <text class="dim">$</text>
    <g transform="translate(22 0)">
      <g clip-path="url(#typed)" transform="translate(0 -28)"><text y="28" class="hi">npx breakinggood <tspan class="url">https://tailwindcss.com</tspan></text></g>
    </g>

    <text class="l a1" y="40"><tspan class="ok">✓</tspan><tspan class="txt" dx="12">opened in your own Chrome, headless</tspan></text>
    <text class="l a2" y="70"><tspan class="ok">✓</tspan><tspan class="txt" dx="12">captured 1440px + 390px, 40 images, 9 API calls</tspan></text>
    <text class="l a3" y="100"><tspan class="ok">✓</tspan><tspan class="txt" dx="12">tokens: fonts, colours, radii, type scale</tspan></text>
    <text class="l a4" y="130"><tspan class="ok">✓</tspan><tspan class="txt" dx="12">wrote Vite + React + Tailwind v4 </tspan><tspan class="dim">(8 components, ~700 lines)</tspan></text>
    <text class="l a5" y="160"><tspan class="ok">✓</tspan><tspan class="txt" dx="12">mock server replaying the captured responses</tspan></text>
    <text class="l a6" y="190"><tspan class="ok">✓</tspan><tspan class="txt" dx="12">npm install &amp;&amp; npm run dev</tspan></text>
    <text class="l a7" y="232"><tspan class="hi">→ running at </tspan><tspan class="url">http://localhost:5173</tspan></text>
    <text class="l a8" y="282"><tspan class="dim">$ </tspan><tspan class="ok blink">▍</tspan></text>
  </g>
</svg>
